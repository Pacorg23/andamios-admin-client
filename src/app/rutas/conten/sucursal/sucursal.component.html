<div class="contenedor">
  <mat-icon class="exit-btn" (click)="goBack()">arrow_back</mat-icon>

  <h1 class="titulo">Sucursales</h1>

  <section class="tabla">
    <table mat-table [dataSource]="sucursales">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="header">No.</th>
        <th mat-cell *matCellDef="let element" class="element"> {{element.id}} </th>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef class="header">Nombre</th>
        <th mat-cell *matCellDef="let element" class="element"> {{element.nombre}} </th>
      </ng-container>

      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef class="header">Direccion</th>
        <th mat-cell *matCellDef="let element" class="element"> {{element.direccion}} </th>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef class="header">Descripcion</th>
        <th mat-cell *matCellDef="let element" class="element"> {{element.descripcion}} </th>
      </ng-container>

      <ng-container matColumnDef="imagen">
        <th mat-header-cell *matHeaderCellDef class="header">Imagen</th>
        <th mat-cell *matCellDef="let element" class="element">
          <img [src]="element.imagen" alt="" class="demo-img">
        </th>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="header"></th>
        <th mat-cell *matCellDef="let element" class="element">
          <button class="opc" (click)="showForm(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button class="opc" (click)="deleteSucursal(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </th>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <button type="button" class="btn btn-success" (click)="agregarSucursal()"> <mat-icon>add</mat-icon> </button>
  </section>
  @if (isFormVisible) {
  <div class="form-section">

    <mat-icon class="close-btn" (click)="closeForm()">close</mat-icon>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <!--NOMBRE-->
      <div class="form-floating mb-3">
        <input type="text" class="form-control" placeholder="nomrbe" formControlName="nombre">
        <label for="floatingInput">Nombre</label>
      </div>
      <!--DIRECCION-->
      <div class="form-floating mb-3">
        <input type="text" class="form-control" placeholder="Direccion" formControlName="direccion">
        <label for="floatingInput">Direccion</label>
      </div>
      <!--DESCRIPCION-->
      <div class="form-floating mb-3">
        <input type="text" class="form-control" placeholder="Descripcion" formControlName="descripcion">
        <label for="floatingInput">Descripcion</label>
      </div>
      <!--IMAGEN-->
      @if(imagen) {
      <div class="selected">
        <h5>Archivo Seleccionado: {{imagen?.name}}</h5>
        <button class="btn btn-danger" type="button" (click)="removeFile()"><mat-icon>close</mat-icon></button>
      </div>
      } @else {
      <input type="file" accept="image/*" id="fileInput" (change)="onFileSelected($event)" class="attachment">
      <button class="btn btn-warning btn-form" type="button" (click)="addFile()"><mat-icon>attachment</mat-icon></button>
      }

      <button type="submit" class="btn btn-success"> <mat-icon>add</mat-icon>
      </button>
    </form>

  </div>
  }

</div>
